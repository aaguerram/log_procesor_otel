# Contrato OpenAPI de soporte - formato institucional
openapi: 3.1.2
# =======================
# Info section
# =======================
info:
  title: Transfer.Mspx.Prometeus.Management
  description: |
    **`ES`** Contrato OpenAPI de soporte para las operaciones expuestas por
    `Transfer.Mspx.Prometeus.Management`.

    Se preservan los paths, métodos HTTP, `operationId`, parámetros y estructuras
    funcionales existentes. Se incorpora metadata institucional
    `x-log-data-protection` únicamente para el tratamiento de datos sensibles en logs.

    **`EN`** Support OpenAPI contract for the operations exposed by
    `Transfer.Mspx.Prometeus.Management`.

    Existing paths, HTTP methods, `operationId`, parameters, and functional payload
    structures are preserved. Institutional `x-log-data-protection` metadata is added
    only for sensitive-data treatment in logs.

    ---
    Change log:
    ---
    **2026** `August` **26** `Updated` **v1.0.0**

    |**Author**|**Changes**|
    |:---------|:----------|
    |Gobierno|<ul><li>Normaliza el contrato a YAML/OpenAPI 3.1.2.</li><li>Incorpora `x-log-data-protection` en campos sensibles sin modificar la interfaz funcional.</li></ul>|
  version: 1.0.0
  contact:
    email: governance@produbanco.com
# =======================
# Tags
# =======================
tags:
  - name: Accounts
    description: Operaciones de soporte relacionadas con cuentas. / Support operations related to accounts.
  - name: card
    description: Operaciones de soporte relacionadas con tarjetas. / Support operations related to cards.
  - name: Catalogs
    description: Operaciones de soporte para catálogos y parametrización. / Support operations for catalogs and 
      parameterization.
  - name: Clients
    description: Operaciones de soporte relacionadas con clientes. / Support operations related to clients.
  - name: Contacts
    description: Operaciones de soporte relacionadas con contactos y beneficiarios. / Support operations related to 
      contacts and beneficiaries.
  - name: Costs
    description: Operaciones de soporte relacionadas con costos. / Support operations related to costs.
  - name: Frauds
    description: Operaciones de soporte para validaciones de fraude y riesgo. / Support operations for fraud and risk 
      validations.
  - name: GeneralConsults
    description: Consultas generales de soporte. / General support queries.
  - name: Institutions
    description: Operaciones de soporte relacionadas con instituciones financieras. / Support operations related to 
      financial institutions.
  - name: Notification
    description: Operaciones de soporte relacionadas con notificaciones y registro técnico. / Support operations related
      to notifications and technical records.
  - name: Products
    description: Operaciones de soporte relacionadas con productos asociados a contactos. / Support operations related 
      to products associated with contacts.
  - name: SecureProducts
    description: Operaciones de soporte relacionadas con configuración de producto seguro. / Support operations related 
      to secure-product configuration.
  - name: TransactionLimits
    description: Operaciones de soporte relacionadas con límites y cupos transaccionales. / Support operations related 
      to transaction limits and quotas.
  - name: Transfer
    description: Operaciones de soporte relacionadas con transferencias e interoperabilidad. / Support operations 
      related to transfers and interoperability.
  - name: Validations
    description: Operaciones de soporte relacionadas con validaciones y parámetros. / Support operations related to 
      validations and parameters.
