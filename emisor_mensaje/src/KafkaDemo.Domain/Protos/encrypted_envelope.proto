syntax = "proto3";

package produbanco.security.v1;

option csharp_namespace = "Produbanco.Security.V1";

enum TelemetryType {
  TELEMETRY_TYPE_UNSPECIFIED = 0;
  TELEMETRY_TYPE_TRACE = 1;
  TELEMETRY_TYPE_METRIC = 2;
  TELEMETRY_TYPE_LOG = 3;
}

message EncryptedPayloadEnvelope {
  // 1. El JSON Cifrado [OBLIGATORIO]
  bytes data = 1;                    // Ciphertext binario del JSON original (no vacío)

  // 2. Parámetros Criptográficos AEAD [OBLIGATORIOS]
  bytes nonce = 2;                   // Vector de Inicialización (IV) de 12 bytes
  bytes auth_tag = 3;                // Tag de autenticación e integridad de 16 bytes
  int32 algorithm_version = 4;       // 1 = AES-256-GCM (mayor a 0)

  // 3. Identificación y Tokenización de Azure Key Vault [OBLIGATORIOS]
  string cert_thumbprint = 5;        // Huella digital del certificado X.509
  string vault_token_id = 6;         // Token o alias de la clave en Azure Key Vault

  // 4. Metadatos de Trazabilidad [OBLIGATORIOS]
  string transaction_id = 7;         // ID de la transacción bancaria
  int64 timestamp_unix_ms = 8;       // Timestamp de emisión (mayor a 0)

  // 5. Contrato Swagger / OpenAPI en formato YAML [ÚNICO CAMPO OPCIONAL]
  string swagger = 9;                // Opcional: solo requerido si es Trace con enmascaramiento

  // 6. Tipo de Señal de Observabilidad OpenTelemetry [OBLIGATORIO]
  TelemetryType telemetry_type = 10; // Trace (1), Metric (2), Log (3) - No Unspecified

  // 7. Nombre del Servicio Microservicio Emisor [OBLIGATORIO]
  string service_name = 11;          // Identificador del microservicio
}
